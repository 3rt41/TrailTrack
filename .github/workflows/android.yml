name: APK Android

on:
  push:
    paths:
      - 'android/**'
      - 'trekking/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # per cancellare gli APK vecchi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Tiene solo l'APK di questa build: cancella quelli delle build precedenti,
      # che riempiono lo spazio Actions (500 MB nel piano gratuito)
      - name: Elimina gli APK delle build precedenti
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const arts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            for (const a of arts) {
              if (a.workflow_run && a.workflow_run.id === context.runId) continue;
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
            }
            core.info(`Eliminati ${arts.length} artifact vecchi`);

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compila APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Rinomina
        run: cp android/app/build/outputs/apk/release/app-release.apk TrailTrack.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TrailTrack-apk
          path: TrailTrack.apk
          retention-days: 7

      - name: Pubblica release scaricabile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=apk-latest
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" TrailTrack.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "TrailTrack APK (build ${GITHUB_RUN_NUMBER})" \
            --notes "Apri questa pagina dal telefono, scarica **TrailTrack.apk** e installalo (consenti \"Installa app sconosciute\" per il browser). Ogni nuova versione si installa sopra la precedente senza perdere i dati.

          Build ${GITHUB_RUN_NUMBER} dal branch \`${GITHUB_REF_NAME}\` (commit ${GITHUB_SHA::7})."
